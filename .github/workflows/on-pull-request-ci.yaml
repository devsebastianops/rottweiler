name: Pull Request CI

on:
  pull_request:
    branches: 
      - main
  push:
    branches:
      - main
  
jobs:
  lint:
    uses: github.com/devsebastianops/github-workflows/.github/workflows/lint.yaml@main
    secrets: inherit
  e2e:
    uses: github.com/devsebastianops/github-workflows/.github/workflows/test.yaml@main
    secrets: inherit
  test-install-script:
    uses: github.com/devsebastianops/github-workflows/.github/workflows/test-install-script.yaml@main
    secrets: inherit
    with:
      binary-name: "rottweiler"